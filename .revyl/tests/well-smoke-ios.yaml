test:
  metadata:
    name: well-smoke-ios
    platform: ios
    tags:
      - smoke
  build:
    name: ai-forge-hackathon iOS
  env_vars:
    - REVYL_AUTH_BYPASS_ENABLED
    - REVYL_AUTH_BYPASS_TOKEN
  variables:
    auth_bypass_token: revyl-demo-token
  blocks:
    - type: manual
      step_type: navigate
      step_description: "wishwell://revyl-auth?token={{auth_bypass_token}}&role=demo&redirect=%2F"
    - type: validation
      step_description: "The Pool home screen (testID well-screen) is visible with the Wishwell title and no auth bypass error"
    - type: validation
      step_description: "Today's boat card (testID today-boat) and the boat progress dots (testID boat-progress) are on screen"
    - type: instructions
      step_description: "Tap the primary action (testID primary-action)"
    - type: validation
      step_description: "The boat screen (testID pass-on-screen) opens"