test:
  metadata:
    name: well-smoke-ios
    platform: ios
    tags:
      - smoke
  build:
    name: ai-forge-hackathon iOS
  env_vars:
    - REVYL_AUTH_BYPASS_ENABLED
    - REVYL_AUTH_BYPASS_TOKEN
  variables:
    auth_bypass_token: revyl-demo-token
  blocks:
    - type: manual
      step_type: navigate
      step_description: "wishwell://revyl-auth?token={{auth_bypass_token}}&role=demo&redirect=%2F"
    - type: validation
      step_description: "The Well home screen (testID well-screen) is visible with the Wishwell title and no auth bypass error"
    - type: validation
      step_description: "The pool (testID well-pool) shows a red coin in the center with dashed rings and holder avatars"
    - type: instructions
      step_description: "Tap the Toss a wish button (testID toss-button)"
    - type: validation
      step_description: "The Toss a wish screen asks What kind of person? and lists four wish types"
